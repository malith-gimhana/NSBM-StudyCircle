<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - NSBM StudyCircle</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/auth.css">
    <link rel="icon" href="images/favicon.png">
</head>
<body>

    <header class="auth-header">
        <div class="auth-nav">

            <a class="auth-logo" href="index.html">📚 StudyCircle</a>
            <a class="back-link" href="index.html">← Back to Home</a>

        </div>
    </header>

    <main class="auth-background">
        
        <div class="auth-card">
            <h1>Create Account</h1>
            <p>Join StudyCircle and start sharing knowledge.</p>

            <form id="registerForm" action="php/register.php" method="POST" onsubmit="return registerCheck()">

                <label for="fullName">Full Name</label>
                <input type="text" id="fullName" name="name" placeholder="Enter your full name" required>

                <label for="registerEmail">Email Address</label>
                <input type="email" id="registerEmail" name="email" placeholder="Enter your email" required>

                <label for="registerPassword">Password</label>
                <input type="password" id="registerPassword" name="password" placeholder="Create a password" required>

                <label for="confirmPassword">Confirm Password</label>
                <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Enter password again" required>

                <p id="registerMessage" class="form-message" aria-live="polite"></p>

                <button class="auth-button" type="submit">Create Account</button>

            </form>

            <p class="auth-bottom">Already have an account? <a href="login.html">Login here</a></p>

        </div>
    </main>

    <script src="js/auth.js"></script>

</body>
</html>
