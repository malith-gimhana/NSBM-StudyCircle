<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - NSBM StudyCircle</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/auth.css">
    <link rel="icon" href="images/favicon.png">

</head>

<body>

    <header class="auth-header">

        <div class="auth-nav">
            <a class="auth-logo" href="index.html">📚 StudyCircle</a>
            <a class="back-link" href="index.html">← Back to Home</a>
        </div>

    </header>

    <main class="auth-background">
        <div class="auth-card">
            <h1>Welcome Back!</h1>

            <p>Login to continue learning with your friends.</p>

            <form id="loginForm" action="php/login.php" method="POST" onsubmit="return loginCheck()">
                
                <label for="loginEmail">Email Address</label>
                <input type="email" id="loginEmail" name="email" placeholder="Enter your email" required>

                <label for="loginPassword">Password</label>
                <input type="password" id="loginPassword" name="password" placeholder="Enter your password" required>

                <p id="loginMessage" class="form-message" aria-live="polite"></p>

                <button class="auth-button" type="submit">Login</button>
            </form>

            <p class="auth-bottom">Don't have an account? <a href="register.html">Register here</a></p>

        </div>
    </main>

    
<script>
    var params = new URLSearchParams(window.location.search);
    var error = params.get("error");
    var message = document.getElementById("loginMessage");

    if (error == "invalid") {
        message.textContent = "Incorrect email or password.";
        message.style.color = "red";
    }
    else if (error == "empty") {
        message.textContent = "Please fill in all fields.";
        message.style.color = "red";
    }
</script>

<script src="js/auth.js"></script>

    <script src="js/auth.js"></script>

</body>
</html>
